<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>文件预览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, .9);
      --line: #dce4ef;
      --text: #172033;
      --muted: #68758b;
      --brand: #2563eb;
      --brand-soft: #e8f0ff;
      --shadow: 0 16px 50px rgba(39, 55, 85, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #dceaff 0, transparent 30rem),
        radial-gradient(circle at 100% 100%, #e8e1ff 0, transparent 32rem),
        var(--bg);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .app { width: min(1440px, 100%); margin: auto; padding: 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(25px, 3vw, 38px); letter-spacing: -.04em; }
    .subtitle { margin: 5px 0 0; color: var(--muted); }
    .actions { display: flex; gap: 10px; }
    .search, button, .button {
      border: 1px solid var(--line); border-radius: 11px; background: var(--panel); color: var(--text);
    }
    .search { width: min(320px, 45vw); padding: 10px 13px; outline: none; }
    .search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    button, .button { padding: 9px 13px; cursor: pointer; text-decoration: none; }
    button:hover, .button:hover { border-color: var(--brand); color: var(--brand); }
    main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 18px; min-height: 72vh; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); }
    .list-head, .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    #count, #meta { color: var(--muted); font-size: 13px; }
    #files { margin: 0; padding: 8px; list-style: none; max-height: calc(72vh - 58px); overflow: auto; }
    .file { width: 100%; display: grid; grid-template-columns: 39px 1fr; gap: 10px; align-items: center; padding: 10px; border: 0; text-align: left; background: transparent; }
    .file:hover, .file.active { background: var(--brand-soft); color: var(--text); }
    .icon { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-size: 18px; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .size { color: var(--muted); font-size: 12px; }
    .preview-title { min-width: 0; }
    #title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    #viewer { height: calc(72vh - 58px); min-height: 480px; display: grid; place-items: center; background: #fff; }
    #viewer iframe, #viewer img, #viewer video { width: 100%; height: 100%; border: 0; object-fit: contain; }
    #viewer audio { width: min(600px, 85%); }
    #viewer pre { align-self: stretch; justify-self: stretch; overflow: auto; margin: 0; padding: 22px; white-space: pre-wrap; color: #d7e2f0; background: #101827; font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .empty { padding: 30px; color: var(--muted); text-align: center; }
    .error { color: #b42318; }
    @media (max-width: 760px) {
      .app { padding: 16px; } header { align-items: stretch; flex-direction: column; } .actions, .search { width: 100%; }
      .search { flex: 1; } main { grid-template-columns: 1fr; } #files { max-height: 300px; } #viewer { height: 65vh; min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><h1>文件预览</h1><p class="subtitle">自动显示此目录中的文件</p></div>
      <div class="actions"><input id="search" class="search" type="search" placeholder="搜索文件…" aria-label="搜索文件"><button id="refresh" type="button">刷新</button></div>
    </header>
    <main>
      <section class="panel" aria-label="文件列表">
        <div class="list-head"><strong>全部文件</strong><span id="count">正在读取…</span></div>
        <ul id="files"></ul>
      </section>
      <section class="panel" aria-label="预览区">
        <div class="preview-head"><div class="preview-title"><div id="title">选择一个文件</div><div id="meta">支持网页、图片、PDF、音视频和文本</div></div><div class="actions"><button id="download" type="button" hidden>下载</button><a id="open" class="button" hidden target="_blank" rel="noopener">新窗口打开</a></div></div>
        <div id="viewer"><div class="empty">请从左侧选择要预览的文件</div></div>
      </section>
    </main>
  </div>
  <script>
    const REPO = 'meditlabs/meditlabs.github.io';
    const DIRECTORY = 'code';
    const API = `https://api.github.com/repos/${REPO}/contents/${DIRECTORY}`;
    const els = Object.fromEntries(['files','count','search','refresh','viewer','title','meta','open','download'].map(id => [id, document.getElementById(id)]));
    const textExt = new Set(['txt','md','markdown','csv','tsv','json','xml','yaml','yml','js','mjs','cjs','ts','tsx','jsx','css','scss','less','py','java','c','h','cpp','hpp','cs','go','rs','rb','php','sh','bat','ps1','sql','ini','toml','log']);
    const imageExt = new Set(['png','jpg','jpeg','gif','webp','svg','bmp','ico','avif']);
    const videoExt = new Set(['mp4','webm','ogv','mov']);
    const audioExt = new Set(['mp3','wav','ogg','m4a','aac','flac']);
    let allFiles = [];

    const extOf = name => name.includes('.') ? name.split('.').pop().toLowerCase() : '';
    const formatSize = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
    const iconFor = file => file.type === 'dir' ? '📁' : imageExt.has(extOf(file.name)) ? '🖼️' : videoExt.has(extOf(file.name)) ? '🎬' : audioExt.has(extOf(file.name)) ? '🎵' : extOf(file.name) === 'pdf' ? '📕' : extOf(file.name) === 'zip' ? '📦' : '📄';

    function renderList() {
      const query = els.search.value.trim().toLowerCase();
      const files = allFiles.filter(file => file.name.toLowerCase().includes(query));
      els.count.textContent = `${files.length} 个`;
      els.files.replaceChildren(...files.map(file => {
        const li = document.createElement('li');
        const button = document.createElement('button');
        button.className = 'file'; button.type = 'button'; button.title = file.name;
        const icon = document.createElement('span'); icon.className = 'icon'; icon.textContent = iconFor(file);
        const info = document.createElement('span');
        const name = document.createElement('span'); name.className = 'name'; name.textContent = file.name; name.style.display = 'block';
        const size = document.createElement('span'); size.className = 'size'; size.textContent = file.type === 'dir' ? '文件夹' : formatSize(file.size);
        info.append(name, size); button.append(icon, info); li.append(button);
        button.addEventListener('click', () => { document.querySelectorAll('.file.active').forEach(x => x.classList.remove('active')); button.classList.add('active'); preview(file); });
        return li;
      }));
      if (!files.length) els.files.innerHTML = '<li class="empty">没有匹配的文件</li>';
    }

    async function loadFiles() {
      els.count.textContent = '正在读取…'; els.refresh.disabled = true;
      try {
        const response = await fetch(API, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
        if (!response.ok) throw new Error(`GitHub API 返回 ${response.status}`);
        const entries = await response.json();
        allFiles = entries.filter(item => item.name.toLowerCase() !== 'index.html').sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name, 'zh-CN'));
        renderList();
      } catch (error) {
        els.count.textContent = '读取失败';
        els.files.innerHTML = `<li class="empty error">无法读取文件列表。请联网后刷新，或在 GitHub Pages 地址打开。<br>${escapeHtml(error.message)}</li>`;
      } finally { els.refresh.disabled = false; }
    }

    async function preview(file) {
      const ext = extOf(file.name); const url = file.download_url || file.html_url;
      els.title.textContent = file.name; els.meta.textContent = file.type === 'dir' ? '文件夹' : `${ext.toUpperCase() || 'FILE'} · ${formatSize(file.size)}`;
      els.open.hidden = false; els.open.href = file.html_url || url; els.download.hidden = file.type === 'dir';
      els.download.onclick = file.type === 'dir' ? null : () => downloadFile(file);
      els.viewer.replaceChildren();
      if (file.type === 'dir') {
        const box = document.createElement('div'); box.className = 'empty'; box.textContent = '请使用“新窗口打开”浏览此文件夹。'; els.viewer.append(box);
      } else if (ext === 'html' || ext === 'htm' || ext === 'pdf') {
        const frame = document.createElement('iframe'); frame.src = url; frame.title = file.name; els.viewer.append(frame);
      } else if (imageExt.has(ext)) {
        const img = document.createElement('img'); img.src = url; img.alt = file.name; els.viewer.append(img);
      } else if (videoExt.has(ext)) {
        const video = document.createElement('video'); video.src = url; video.controls = true; els.viewer.append(video);
      } else if (audioExt.has(ext)) {
        const audio = document.createElement('audio'); audio.src = url; audio.controls = true; els.viewer.append(audio);
      } else if (textExt.has(ext)) {
        const pre = document.createElement('pre'); pre.textContent = '正在加载…'; els.viewer.append(pre);
        try { const response = await fetch(url); if (!response.ok) throw new Error(`HTTP ${response.status}`); pre.textContent = await response.text(); }
        catch (error) { pre.textContent = `无法加载文本：${error.message}`; }
      } else {
        const box = document.createElement('div'); box.className = 'empty'; box.innerHTML = '此格式无法在浏览器中直接预览。<br>请使用“新窗口打开”查看或下载。'; els.viewer.append(box);
      }
    }

    async function downloadFile(file) {
      const originalText = els.download.textContent;
      els.download.disabled = true; els.download.textContent = '下载中…';
      try {
        const response = await fetch(file.download_url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blobUrl = URL.createObjectURL(await response.blob());
        const link = document.createElement('a'); link.href = blobUrl; link.download = file.name;
        document.body.append(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      } catch (error) {
        window.open(file.download_url || file.html_url, '_blank', 'noopener');
      } finally {
        els.download.disabled = false; els.download.textContent = originalText;
      }
    }

    function escapeHtml(value) { const node = document.createElement('div'); node.textContent = value; return node.innerHTML; }
    els.search.addEventListener('input', renderList);
    els.refresh.addEventListener('click', loadFiles);
    loadFiles();
  </script>
</body>
</html>
