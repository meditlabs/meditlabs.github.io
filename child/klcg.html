<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <title>幼儿专注力训练乐园</title>
  <style>
    :root{--ink:#223049;--muted:#66738a;--orange:#ff8a4c;--green:#59c985}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 12% 8%,#fff0bd 0 7%,transparent 7.2%),linear-gradient(180deg,#fffdf7,#f5fbff);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh}button{font:inherit}.app{width:min(1120px,calc(100% - 32px));margin:auto;padding-bottom:42px}.topbar{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:18px 18px 18px 5px;background:var(--green);color:#fff;font-size:24px;font-weight:900;box-shadow:0 8px 0 #d9f1e1;transform:rotate(-3deg)}.brand-text{display:grid}.brand-text b{font-size:20px}.brand-text small{color:var(--muted);margin-top:3px}.actions{display:flex;align-items:center;gap:10px}.reset{border:0;background:transparent;color:var(--muted);padding:10px;cursor:pointer}.score{display:flex;align-items:baseline;gap:5px;background:#fff;border:2px solid #ffe09d;padding:10px 18px;border-radius:999px;box-shadow:0 7px 20px #f2dca44a}.score b{font-size:24px;color:#ff8d2d}.hero{position:relative;min-height:274px;overflow:hidden;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;padding:36px 52px;border-radius:36px;background:linear-gradient(135deg,#e7f7ff,#fff0cf);box-shadow:inset 0 0 0 2px #fff,0 18px 45px #607b8f1a}.hero-copy{position:relative;z-index:2}.tag{display:inline-block;margin:0 0 14px;padding:7px 13px;border-radius:999px;color:#277aa0;background:#fff9;font-weight:700;font-size:14px}.hero h1{margin:0;font-size:clamp(38px,5vw,62px);line-height:1.13;letter-spacing:-.05em}.hero h1 em{color:var(--orange);font-style:normal}.hero p{max-width:620px;margin:18px 0 0;font-size:17px;line-height:1.8;color:#53627b}.scene{position:relative;height:220px}.sun{position:absolute;right:60px;top:8px;color:#ffc92f;font-size:80px}.hill{position:absolute;bottom:-85px;border-radius:50% 50% 0 0}.hill.a{width:360px;height:190px;right:-20px;background:#81d99c;transform:rotate(-6deg)}.hill.b{width:260px;height:155px;right:160px;background:#b5e888;transform:rotate(7deg)}.flower{position:absolute;z-index:2;right:66px;bottom:25px;font-size:46px;color:#ff7691}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.mode{min-height:108px;display:grid;grid-template-columns:45px 1fr;grid-template-rows:1fr 1fr;align-items:center;text-align:left;border:2px solid transparent;border-radius:24px;padding:18px;background:#fff;color:var(--ink);box-shadow:0 10px 30px #45617a12;cursor:pointer;transition:.18s}.mode:hover{transform:translateY(-3px)}.mode.active{border-color:#77cce9;background:#effbff}.mode .icon{grid-row:1/3;font-size:32px}.mode b{align-self:end}.mode small{align-self:start;color:var(--muted);margin-top:3px}.game{background:#fff;padding:28px;border-radius:32px;box-shadow:0 18px 55px #4160791c}.game-head{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #edf1f5;padding-bottom:18px}.game-head small{color:var(--orange);font-weight:800}.game-head h2{margin:3px 0 0;font-size:27px}.feedback{margin:0;color:var(--muted);background:#fff9e5;padding:10px 16px;border-radius:999px}.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.legend>div{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:18px;font-weight:700}.legend i{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;color:#fff;font-style:normal;font-size:20px}.stage{min-height:260px;display:grid;place-items:center;align-content:center;background:linear-gradient(180deg,#eaf8ff,#f8fdff);border:2px dashed #c6e8f6;border-radius:28px}.cloud{position:relative;width:174px;height:60px;border:5px solid #2d3950;border-radius:35px;background:#fff;margin-top:30px}.cloud i{position:absolute;bottom:29px;border:5px solid #2d3950;border-bottom:0;background:#fff;border-radius:50% 50% 0 0}.cloud i:nth-child(1){width:58px;height:48px;left:18px}.cloud i:nth-child(2){width:70px;height:68px;left:52px}.cloud i:nth-child(3){width:53px;height:43px;right:12px}.drops{min-height:78px;display:flex;justify-content:center;gap:16px;padding-top:18px}.drop{width:21px;height:31px;border:4px solid #2d3950;border-radius:60% 40% 60% 40%;transform:rotate(45deg)}.drop:nth-child(even){margin-top:18px}.question{color:var(--muted)}.question b{font-size:24px;color:#1d8fc0}.answers,.directions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.answers button,.directions button{min-height:64px;border:2px solid #e8edf1;border-radius:18px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer;transition:.16s}.answers button:hover,.directions button:hover{transform:translateY(-3px);border-color:#83cadd}.answers .swatch{display:inline-block;width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:9px}.connect{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(100px,30vw,410px);min-height:470px;padding:24px clamp(5px,4vw,54px);margin-top:20px;overflow:hidden;border:2px dashed #dbe8ee;border-radius:28px;background:linear-gradient(135deg,#fbfdff,#fffdf7)}.connect svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.connect path{fill:none;stroke:#72b6d0;stroke-width:6;stroke-linecap:round;stroke-dasharray:12 10}.column{display:grid;grid-template-rows:repeat(4,1fr);gap:10px;z-index:2}.column button{min-width:145px;min-height:88px;display:grid;place-items:center;border:3px solid #e4ebef;border-radius:22px;background:#fff;cursor:pointer}.column.right button{justify-self:end}.column button.selected{border-color:#ffb15f;background:#fff8e9;box-shadow:0 0 0 6px #fff0cf}.column button.solved{border-color:#73d39a;background:#eefcf3}.dots{width:78px;display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.dots i{width:22px;height:22px;border-radius:50%;background:#36a9f1;box-shadow:inset 0 -3px 0 #1681bf}.number{width:62px;height:62px;display:grid;place-items:center;border-radius:50%;border:6px solid #ffc83d;font-size:35px;font-weight:900}.shape-set{display:flex;align-items:center;justify-content:center;gap:4px;font-size:34px;line-height:1}.shape-set span{filter:drop-shadow(0 2px 0 #24304725)}.arrow-stage{min-height:250px;display:grid;place-items:center;align-content:center;gap:9px;border-radius:28px;background:linear-gradient(150deg,#eef9ff,#fff8e8);border:2px dashed #cfe4ed}.focus-color{width:112px;height:112px;border-radius:50%;box-shadow:inset 0 -9px 0 #22304916,0 12px 25px #24475d20}.directions button{font-size:44px}.note{text-align:center;color:var(--muted);font-size:14px;margin-top:20px}.hidden{display:none!important}
    @media(max-width:760px){.app{width:min(100% - 20px,640px)}.brand-text small{display:none}.hero{min-height:250px;grid-template-columns:1fr;padding:30px 26px}.scene{position:absolute;inset:0;opacity:.28}.modes{grid-template-columns:repeat(2,1fr)}.mode{min-height:92px;padding:13px}.game{padding:18px}.game-head{align-items:flex-start;flex-direction:column;gap:9px}.feedback{width:100%;border-radius:15px}.legend,.answers,.directions{grid-template-columns:repeat(2,1fr)}.connect{gap:45px;padding:18px 2px;min-height:430px}.column button{min-width:98px;min-height:78px}.reset{font-size:12px;padding:5px}.score{padding:8px 12px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="logo">芽</span><span class="brand-text"><b>小芽专注乐园</b><small>每天十分钟，发现小进步</small></span></div>
      <div class="actions"><button class="reset" id="reset">重新开始</button><div class="score" aria-live="polite">⭐ <b id="score">0</b><small>分</small></div></div>
    </header>
    <section class="hero">
      <div class="hero-copy"><span class="tag">3—6 岁 · 观察力与专注力</span><h1>看一看，想一想，<br><em>快乐闯关</em></h1><p>没有倒计时，不催促。每次进入、切换模式或完成一组，都会随机生成新题。</p></div>
      <div class="scene" aria-hidden="true"><span class="sun">☀</span><span class="hill a"></span><span class="hill b"></span><span class="flower">✿</span></div>
    </section>
    <nav class="modes" aria-label="训练模式">
      <button class="mode active" data-mode="rain"><span class="icon">🌧️</span><b>雨滴找颜色</b><small>数数与颜色</small></button>
      <button class="mode" data-mode="dots"><span class="icon">🔵</span><b>点数连数字</b><small>数量对应</small></button>
      <button class="mode" data-mode="shapes"><span class="icon">🔺</span><b>图形配配对</b><small>观察与匹配</small></button>
      <button class="mode" data-mode="arrows"><span class="icon">↗️</span><b>颜色指方向</b><small>规则与反应</small></button>
    </nav>
    <section class="game">
      <header class="game-head"><div><small id="round">第 1 题</small><h2 id="title">雨滴找颜色</h2></div><p class="feedback" id="feedback" aria-live="polite">数一数雨滴，再选择正确颜色</p></header>
      <div id="content"></div>
    </section>
    <p class="note">家长小提示：每次练习 5—10 分钟即可。得分只保留在当前页面，不收集任何信息。</p>
  </main>
  <script>
    const colors=[{name:'红色',value:'#ff5d73',soft:'#ffe3e8'},{name:'蓝色',value:'#37a8ff',soft:'#dff2ff'},{name:'黄色',value:'#ffc93d',soft:'#fff3c7'},{name:'绿色',value:'#43c978',soft:'#dcf8e7'}];
    const modes={rain:{title:'雨滴找颜色',tip:'数一数雨滴，再选择正确颜色'},dots:{title:'点数连数字',tip:'先点左边的点数，再点右边对应数字'},shapes:{title:'图形配配对',tip:'找出含有相同图形的组合并连起来'},arrows:{title:'颜色指方向',tip:'记住颜色规则，选出对应的箭头'}};
    const patterns=[
      [['●','#ff5362'],['■','#46ca72'],['●','#ffd133']], [['●','#33acf0'],['▬','#ffd133'],['▲','#ff5362']],
      [['●','#ffd133'],['▲','#33acf0'],['★','#ff5362']], [['⬢','#ffd133'],['▲','#46ca72'],['●','#33acf0']],
      [['●','#46ca72'],['■','#ffd133'],['★','#33acf0']], [['⬢','#ff5362'],['●','#33acf0'],['▲','#ffd133']],
      [['●','#33acf0'],['■','#ff5362'],['●','#46ca72']], [['●','#ff5362'],['▬','#46ca72'],['★','#ffd133']]
    ];
    const directions=['→','↑','←','↓'];
    const state={mode:'rain',score:0,round:{rain:1,dots:1,shapes:1,arrows:1},pairs:[],selected:null};
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
    const pick=(size,count=4)=>shuffle(Array.from({length:size},(_,i)=>i+1)).slice(0,count);
    const setFeedback=t=>$('#feedback').textContent=t;
    function reward(text){state.score+=10;$('#score').textContent=state.score;setFeedback(text)}
    function setHeader(){const m=modes[state.mode];$('#title').textContent=m.title;$('#round').textContent=state.mode==='rain'||state.mode==='arrows'?`第 ${state.round[state.mode]} 题`:`第 ${state.round[state.mode]} 组`;setFeedback(m.tip)}
    function render(){setHeader();state.pairs=[];state.selected=null;if(state.mode==='rain')renderRain();if(state.mode==='dots')renderPairs('dots');if(state.mode==='shapes')renderPairs('shapes');if(state.mode==='arrows')renderArrows()}
    function renderRain(){const count=Math.floor(Math.random()*4)+1;state.rainCount=count;const legend=colors.map((c,i)=>`<div style="background:${c.soft}"><i style="background:${c.value}">${i+1}</i>${c.name}</div>`).join('');const drops=Array.from({length:count},()=>'<span class="drop"></span>').join('');const answers=shuffle(colors).map(c=>`<button data-color="${c.name}"><span class="swatch" style="background:${c.value}"></span>${c.name}</button>`).join('');$('#content').innerHTML=`<div class="legend">${legend}</div><div class="stage"><div class="cloud"><i></i><i></i><i></i></div><div class="drops">${drops}</div><div class="question">这里有 <b>${count}</b> 滴雨</div></div><div class="answers">${answers}</div>`;$$('[data-color]').forEach(b=>b.onclick=()=>{if(b.dataset.color===colors[count-1].name){reward('答对啦！马上生成新题 ✨');setTimeout(()=>{state.round.rain++;render()},650)}else setFeedback('再看一看：雨滴数量对应哪个数字颜色？')})}
    function renderPairs(type){const values=pick(type==='dots'?6:8);state.left=shuffle(values);state.right=shuffle(values);const item=(key,side)=>{if(type==='dots'){if(side==='left')return `<span class="dots">${Array.from({length:key},()=>'<i></i>').join('')}</span>`;return `<span class="number">${key}</span>`}const seq=side==='right'?shuffle(patterns[key-1]):patterns[key-1];return `<span class="shape-set">${seq.map(x=>`<span style="color:${x[1]}">${x[0]}</span>`).join('')}</span>`};const left=state.left.map((k,i)=>`<button data-side="left" data-row="${i}" data-key="${k}">${item(k,'left')}</button>`).join('');const right=state.right.map((k,i)=>`<button data-side="right" data-row="${i}" data-key="${k}">${item(k,'right')}</button>`).join('');$('#content').innerHTML=`<div class="connect"><svg></svg><div class="column">${left}</div><div class="column right">${right}</div></div>`;$$('[data-side="left"]').forEach(b=>b.onclick=()=>{if(b.classList.contains('solved'))return;$$('[data-side="left"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.selected=b});$$('[data-side="right"]').forEach(b=>b.onclick=()=>pairRight(b,type))}
    function pairRight(right,type){if(!state.selected)return setFeedback('请先选择左边的一项');if(right.classList.contains('solved'))return;if(right.dataset.key!==state.selected.dataset.key)return setFeedback(type==='dots'?'数量还不一样，再数一次试试':'图形不完全一样，再仔细比一比');state.selected.classList.remove('selected');state.selected.classList.add('solved');right.classList.add('solved');state.pairs.push([state.selected,right]);state.selected=null;reward(state.pairs.length===4?'全部正确！马上生成新题 ⭐':'连对啦，再找一组吧');drawLines();if(state.pairs.length===4)setTimeout(()=>{state.round[type]++;render()},900)}
    function drawLines(){const board=$('.connect'),svg=$('.connect svg'),box=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);svg.innerHTML=state.pairs.map(([a,b])=>{const x=a.getBoundingClientRect(),y=b.getBoundingClientRect(),x1=x.right-box.left,y1=x.top+x.height/2-box.top,x2=y.left-box.left,y2=y.top+y.height/2-box.top,m=(x1+x2)/2;return `<path d="M ${x1} ${y1} C ${m} ${y1}, ${m} ${y2}, ${x2} ${y2}"></path>`}).join('')}
    function renderArrows(){state.arrowMap=shuffle([0,1,2,3]);state.arrowColor=Math.floor(Math.random()*4);const legend=colors.map((c,i)=>`<div style="background:${c.soft}"><i style="background:${c.value}">${directions[state.arrowMap[i]]}</i>${c.name}</div>`).join('');const buttons=shuffle([0,1,2,3]).map(i=>`<button data-dir="${i}">${directions[i]}</button>`).join('');$('#content').innerHTML=`<div class="legend">${legend}</div><div class="arrow-stage"><p>这个颜色应该选择哪个方向？</p><span class="focus-color" style="background:${colors[state.arrowColor].value}"></span><b>${colors[state.arrowColor].name}</b></div><div class="directions">${buttons}</div>`;$$('[data-dir]').forEach(b=>b.onclick=()=>{if(+b.dataset.dir===state.arrowMap[state.arrowColor]){reward('方向正确！马上生成新题 🧭');setTimeout(()=>{state.round.arrows++;render()},600)}else setFeedback('看看上面的颜色规则，再试一次')})}
    $$('.mode').forEach(b=>b.onclick=()=>{$$('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.mode=b.dataset.mode;state.round[state.mode]++;render()});
    $('#reset').onclick=()=>{state.score=0;$('#score').textContent='0';state.round={rain:1,dots:1,shapes:1,arrows:1};render()};window.addEventListener('resize',()=>{if(state.pairs.length)drawLines()});render();
  </script>
</body>
</html>
